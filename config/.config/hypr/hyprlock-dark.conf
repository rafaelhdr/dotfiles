$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(000000ff)
}

input-field {
    monitor =
    size = 22%, 52

    outline_thickness = 1
    inner_color = rgba(000000ff)
    outer_color = rgba(202020ff)
    check_color = rgba(303030ff)
    fail_color = rgba(400000ff)

    font_color = rgba(303030ff)
    font_size = 16
    fade_on_empty = false
    rounding = 12

    font_family = $font
    placeholder_text =
    fail_text = $PAMFAIL

    dots_spacing = 0.3
    dots_rounding = -1

    position = 0, 0
    halign = center
    valign = center
}
