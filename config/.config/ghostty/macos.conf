# macOS (AppKit) only. Not loaded on Linux.

# Titlebar style. `tabs` (Ghostty's custom titlebar with the tab bar drawn into
# it) is broken on macOS 26+ / 27 — the tab bar renders invisible, leaving an
# empty strip with only the traffic lights. Tabs still exist and can be
# navigated, they just aren't drawn. `transparent` uses the native macOS
# titlebar and the real macOS tab bar, which appears automatically once a
# window has more than one tab.
macos-titlebar-style = transparent

# Uncomment to make the Option key behave as Alt so the alt+h/alt+l tab binds
# work from a Mac keyboard. Note: this disables Option-based accented character
# input (e.g. ´, ~, ^), so leave it off if you type accented characters.
# macos-option-as-alt = true
