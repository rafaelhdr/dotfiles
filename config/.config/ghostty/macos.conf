# macOS (AppKit) only. Not loaded on Linux.

# Titlebar style. `tabs` (Ghostty's custom titlebar with the tab bar drawn into
# it) is broken on macOS 26+ / 27 — the tab bar renders invisible, leaving an
# empty strip with only the traffic lights. Tabs still exist and can be
# navigated, they just aren't drawn. `transparent` uses the native macOS
# titlebar and the real macOS tab bar, which appears automatically once a
# window has more than one tab.
macos-titlebar-style = transparent

# Make the left Option key behave as Alt so the alt-based binds (ghostty
# alt+h/l tabs, herdr alt+j/k/m/n/r navigation) work from a Mac keyboard.
# Without this, Option+J sends "∆" instead of alt+j. The right Option key keeps
# its normal behaviour for accented character input (´, ~, ^, ç).
macos-option-as-alt = left

# herdr's "working" status icon (◐, U+25D0) rendered as a circled 9 in the
# herdr sidebar. Draw it from Apple Symbols instead of falling back through
# JetBrains Mono -> Menlo.
font-codepoint-map = U+25D0=Apple Symbols
