# macOS (AppKit) only. Not loaded on Linux.

# Blend the tab bar into the window titlebar — the closest native equivalent to
# the GTK tab styling used on Linux (tabs.css).
macos-titlebar-style = tabs

# Uncomment to make the Option key behave as Alt so the alt+h/alt+l tab binds
# work from a Mac keyboard. Note: this disables Option-based accented character
# input (e.g. ´, ~, ^), so leave it off if you type accented characters.
# macos-option-as-alt = true
